<!--
  PLANTILLA DE EMAILJS: AVISO INTERNO AL EQUIPO (opcional)
  Se envía a SU correo cada vez que alguien llena el formulario o se suscribe.
  Configuración de la plantilla:
    To Email : su-correo@gmail.com   (escríbalo fijo)
    Reply To : {{reply_to}}          (así puede responder directo al cliente)
    Subject  : [NEXO] Nuevo contacto: {{to_name}} ({{empresa}})
  Copie el ID de esta plantilla en VITE_EMAILJS_TEMPLATE_NOTIFY.
-->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;padding:20px;color:#1a1236;">
  <h2 style="margin:0 0 4px;color:#5b32d6;">Nuevo {{tipo}} desde la web de NEXO</h2>
  <p style="margin:0 0 18px;color:#6b6290;font-size:13px;">{{fecha}}</p>
  <table cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:14px;">
    <tr style="background:#f4efff;"><td><b>Nombre</b></td><td>{{to_name}}</td></tr>
    <tr><td><b>Empresa</b></td><td>{{empresa}}</td></tr>
    <tr style="background:#f4efff;"><td><b>Cargo</b></td><td>{{cargo}}</td></tr>
    <tr><td><b>Teléfono</b></td><td>{{telefono}}</td></tr>
    <tr style="background:#f4efff;"><td><b>Email</b></td><td>{{to_email}}</td></tr>
    <tr><td><b>País</b></td><td>{{pais}}</td></tr>
    <tr style="background:#f4efff;"><td><b>Folleto</b></td><td>{{folleto}}</td></tr>
    <tr><td valign="top"><b>Mensaje</b></td><td>{{mensaje}}</td></tr>
  </table>
  <p style="margin-top:18px;color:#6b6290;font-size:13px;">Responda a este correo para escribirle directamente al cliente.</p>
</div>
